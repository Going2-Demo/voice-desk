[package]
name = "voice-desk"
version = "0.1.0"
description = "Voice Desk: ditado por voz para Mac e Windows"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
name = "voice_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
tauri = { version = "~2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v7"] }
unicode-normalization = "0.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
tempfile = "3"

[features]
teste-plataforma = []
