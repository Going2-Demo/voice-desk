name: build-dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dev
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  instalador:
    name: instalador (${{ matrix.nome }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {
              os: macos-14,
              nome: mac,
              alvos: "aarch64-apple-darwin,x86_64-apple-darwin",
              args: "--target universal-apple-darwin",
              glob: "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg",
            }
          - {
              os: windows-latest,
              nome: win,
              alvos: "",
              args: "",
              glob: "src-tauri/target/release/bundle/nsis/*.exe",
            }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.alvos }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Compilar o instalador
        shell: bash
        env:
          VOICE_DESK_COMMIT: ${{ github.sha }}
        run: pnpm tauri build ${{ matrix.args }}
      - name: Conferir que o instalador do Mac é universal
        if: matrix.nome == 'mac'
        run: |
          dmg=$(ls ${{ matrix.glob }} | head -1)
          hdiutil attach "$dmg" -mountpoint /tmp/vd -nobrowse -quiet
          archs=$(lipo -archs "/tmp/vd/Voice Desk.app/Contents/MacOS/voice-desk")
          hdiutil detach /tmp/vd -quiet
          echo "arquiteturas: $archs"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "instalador não é universal"; exit 1;; esac
      - name: Renomear
        shell: bash
        run: |
          arq=$(ls ${{ matrix.glob }} | head -1)
          ext="${arq##*.}"
          mkdir -p saida
          cp "$arq" "saida/voice-desk-dev-${GITHUB_SHA::7}-${{ matrix.nome }}.$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.nome }}
          path: saida/*

  fumaca:
    name: fumaça (${{ matrix.nome }})
    needs: instalador
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, nome: mac }
          - { os: windows-latest, nome: win }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador-${{ matrix.nome }}
          path: instalador
      - name: Instalar
        run: |
          if [ "${{ matrix.nome }}" = "mac" ]; then
            dmg=$(ls instalador/*.dmg | head -1)
            hdiutil attach "$dmg" -mountpoint /tmp/vd -nobrowse -quiet
            mkdir -p "$RUNNER_TEMP/apps"
            cp -R "/tmp/vd/Voice Desk.app" "$RUNNER_TEMP/apps/"
            hdiutil detach /tmp/vd -quiet
            echo "EXE=$RUNNER_TEMP/apps/Voice Desk.app/Contents/MacOS/voice-desk" >> "$GITHUB_ENV"
          else
            exe=$(ls instalador/*.exe | head -1)
            # O instalador silencioso pode abrir o app ao terminar e não devolver o controle:
            # roda em segundo plano, espera o executável aparecer e encerra o que ficou aberto.
            ./"$exe" /S > /dev/null 2>&1 &
            achado=""
            for _ in $(seq 1 30); do
              sleep 2
              achado=$(find "$LOCALAPPDATA" -maxdepth 3 -iname 'voice*desk*.exe' ! -iname 'uninst*' | head -1)
              [ -n "$achado" ] && break
            done
            [ -n "$achado" ] || { echo "instalação silenciosa não deixou o executável"; find "$LOCALAPPDATA" -maxdepth 2 -newer "$exe" | head -20; exit 1; }
            sleep 10
            taskkill //F //IM "$(basename "$achado")" > /dev/null 2>&1 || true
            taskkill //F //IM "$(basename "$exe")" > /dev/null 2>&1 || true
            echo "EXE=$achado" >> "$GITHUB_ENV"
          fi
      - name: Abrir, esperar e conferir
        run: |
          dados="$RUNNER_TEMP/dados"
          mkdir -p "$dados"
          export VOICE_DESK_PASTA_DADOS="$dados"
          "$EXE" --oculto > "$RUNNER_TEMP/saida.txt" 2>&1 &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "o app não seguiu vivo"; tail -30 "$RUNNER_TEMP/saida.txt"; exit 1; }
          kill "$pid" || true
          log=$(ls "$dados"/logs/voice-desk.*.log | head -1)
          [ -n "$log" ] || { echo "sem arquivo de log"; exit 1; }
          grep -q 'app_iniciado' "$log" || { echo "log sem app_iniciado"; tail -30 "$log"; exit 1; }
          if grep -qiE 'panic|erro_interno' "$log"; then echo "log com panic ou erro"; tail -30 "$log"; exit 1; fi
          grep -aq "${{ github.sha }}" "$EXE" || { echo "versão do executável diferente do commit"; exit 1; }
          echo "fumaça ok: app vivo, app_iniciado no log, versão = ${{ github.sha }}"
      - name: Guardar o log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fumaca-log-${{ matrix.nome }}
          path: ${{ runner.temp }}/dados/logs/*
          if-no-files-found: ignore

  release-dev:
    name: release dev-<sha>
    needs: [instalador, fumaca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - name: Publicar pré-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${GITHUB_SHA::7}"
          gh release create "$tag" saida/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Dev $tag" --notes "Build de desenvolvimento do commit $GITHUB_SHA."
