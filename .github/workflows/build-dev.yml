name: build-dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dev
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  instalador:
    name: instalador (${{ matrix.nome }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-14, nome: mac, glob: "src-tauri/target/release/bundle/dmg/*.dmg" }
          - { os: windows-latest, nome: win, glob: "src-tauri/target/release/bundle/nsis/*.exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Compilar o instalador
        shell: bash
        env:
          VOICE_DESK_COMMIT: ${{ github.sha }}
        run: pnpm tauri build
      - name: Renomear
        shell: bash
        run: |
          arq=$(ls ${{ matrix.glob }} | head -1)
          ext="${arq##*.}"
          mkdir -p saida
          cp "$arq" "saida/voice-desk-dev-${GITHUB_SHA::7}-${{ matrix.nome }}.$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.nome }}
          path: saida/*

  release-dev:
    name: release dev-<sha>
    needs: instalador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - name: Publicar pré-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${GITHUB_SHA::7}"
          gh release create "$tag" saida/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Dev $tag" --notes "Build de desenvolvimento do commit $GITHUB_SHA."
