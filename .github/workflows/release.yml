name: release

# Versão pública: tag vX.Y.Z. Só o BD autoriza a tag (docs/arquitetura/deploy.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  conferir:
    name: conferir versão e changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag, versão do app e site/versoes.json batem
        run: |
          v="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          site=$(node -p "require('./site/versoes.json')[0].versao")
          echo "tag=$v app=$app tauri=$tauri site=$site"
          [ "$v" = "$app" ] && [ "$v" = "$tauri" ] && [ "$v" = "$site" ] || { echo "versões divergentes"; exit 1; }
      - name: Gerar notas da versão
        run: |
          node -e "const v=require('./site/versoes.json')[0]; console.log(v.mudancas.map(m=>'- '+m).join('\n'))" > notas.md
      - uses: actions/upload-artifact@v4
        with: { name: notas, path: notas.md }

  test:
    needs: conferir
    uses: ./.github/workflows/ci.yml

  instalador:
    name: instalador (${{ matrix.nome }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {
              os: macos-14,
              nome: mac,
              alvos: "aarch64-apple-darwin,x86_64-apple-darwin",
              args: "--target universal-apple-darwin",
              glob: "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg",
            }
          - {
              os: windows-latest,
              nome: win,
              alvos: "",
              args: "",
              glob: "src-tauri/target/release/bundle/nsis/*.exe",
            }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.alvos }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Compilar o instalador
        shell: bash
        env:
          VOICE_DESK_COMMIT: ${{ github.sha }}
        run: pnpm tauri build ${{ matrix.args }}
      - name: Conferir que o instalador do Mac é universal
        if: matrix.nome == 'mac'
        run: |
          dmg=$(ls ${{ matrix.glob }} | head -1)
          hdiutil attach "$dmg" -mountpoint /tmp/vd -nobrowse -quiet
          archs=$(lipo -archs "/tmp/vd/Voice Desk.app/Contents/MacOS/voice-desk")
          hdiutil detach /tmp/vd -quiet
          echo "arquiteturas: $archs"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "instalador não é universal"; exit 1;; esac
      - name: Renomear
        shell: bash
        run: |
          arq=$(ls ${{ matrix.glob }} | head -1)
          ext="${arq##*.}"
          mkdir -p saida
          # Nomes fixos: a página do projeto aponta para releases/latest/download/<nome> (RF-27.1).
          if [ "${{ matrix.nome }}" = mac ]; then alvo=voice-desk-mac.dmg; else alvo=voice-desk-windows.exe; fi
          cp "$arq" "saida/$alvo"
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.nome }}
          path: saida/*

  publicar:
    name: publicar release ${{ github.ref_name }}
    needs: instalador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - name: Publicar versão pública
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" saida/voice-desk-mac.dmg saida/voice-desk-windows.exe \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Voice Desk ${GITHUB_REF_NAME#v}" --notes-file saida/notas.md
