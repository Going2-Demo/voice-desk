<style>
:root{--bg:#f6f6f3;--card:#fff;--fg:#1c1c1a;--muted:#6a6a64;--borda:#e2e2dc;
--c1:#2f6fdb;--c2:#1f9d6b;--c3:#d98a1c;--c4:#c2410c;--c5:#7c3aed;--c6:#0e7490;--c7:#9ca3af;--c8:#db2777;--c9:#64748b}
@media (prefers-color-scheme: dark){:root{--bg:#141413;--card:#1e1e1c;--fg:#ecece8;--muted:#a3a39c;--borda:#34342f;--c7:#4b5563;--c9:#94a3b8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--muted);margin:2px 0 0}
.grade{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cartao{background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:16px;min-width:0}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.barra{height:10px;background:var(--borda);border-radius:5px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--c2)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--borda);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
.tabela{overflow-x:auto}
svg{width:100%;height:auto;display:block}
.legenda{margin-top:8px}.legenda span{display:inline-flex;align-items:center;gap:4px;margin:0 12px 4px 0;color:var(--muted);font-size:12px}
.legenda i{width:10px;height:10px;border-radius:2px;display:inline-block}
.alerta{color:var(--c4);font-weight:600}
section{margin-top:16px}
details summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>

<script>
(function(){

  var app = document.getElementById('app');
  if (!D.produto) { app.innerHTML = '<p>Painel ainda sem dados.</p>'; return; }

  var esc = function(v){ return String(v == null ? '—' : v).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var num = function(v, d){ return v == null ? '—' : Number(v).toLocaleString('pt-BR', {maximumFractionDigits: d == null ? 1 : d}); };
  var horas = function(h){ return h == null ? '—' : (h >= 24 ? num(h/24) + ' d' : num(h) + ' h'); };
  var dataBR = function(s){ if(!s) return '—'; var p = String(s).slice(0,10).split('-'); return p[2] + '/' + p[1]; };
  var desde = function(s){ if(!s) return '—'; var h = (Date.now() - new Date(s).getTime())/36e5; return horas(h); };
  var barra = function(p){ return '<div class="barra"><i style="width:' + Math.max(0, Math.min(100, p || 0)) + '%"></i></div>'; };
  var tabela = function(cab, linhas){
    if (!linhas.length) return '<p class="sub">Nada aqui.</p>';
    return '<div class="tabela"><table><thead><tr>' + cab.map(function(c){ return '<th>' + c + '</th>'; }).join('') +
      '</tr></thead><tbody>' + linhas.map(function(l){ return '<tr>' + l.map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></div>';
  };
  var legenda = function(itens){ return '<div class="legenda">' + itens.map(function(s){ return '<span><i style="background:' + s.cor + '"></i>' + esc(s.nome) + '</span>'; }).join('') + '</div>'; };

  var W = 640, H = 230, P = {l: 36, r: 12, t: 10, b: 28};
  function eixos(rotulos, max, x, y){
    var g = '<line x1="' + P.l + '" y1="' + (H - P.b) + '" x2="' + (W - P.r) + '" y2="' + (H - P.b) + '" stroke="var(--borda)"/>';
    [0, 0.5, 1].forEach(function(f){ var v = Math.round(max * f); g += '<text x="' + (P.l - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + v + '</text>'; });
    var passo = Math.max(1, Math.ceil(rotulos.length / 8));
    rotulos.forEach(function(r, i){ if (i % passo === 0 || i === rotulos.length - 1) g += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + esc(r) + '</text>'; });
    return g;
  }
  function grafLinhas(series, rotulos){
    var n = rotulos.length; if (!n) return '<p class="sub">Sem dados ainda.</p>';
    var max = Math.max(1, Math.max.apply(null, series.map(function(s){ return Math.max.apply(null, s.valores); })));
    var x = function(i){ return P.l + (n === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (n - 1)); };
    var y = function(v){ return H - P.b - (v / max) * (H - P.t - P.b); };
    var g = eixos(rotulos, max, x, y);
    series.forEach(function(s){ g += '<polyline fill="none" stroke="' + s.cor + '" stroke-width="2" points="' + s.valores.map(function(v, i){ return x(i) + ',' + y(v); }).join(' ') + '"/>'; });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + '</svg>' + legenda(series);
  }
  function grafAreas(camadas, rotulos){ // camadas de baixo para cima
    var n = rotulos.length; if (!n) return '<p class="sub">Sem dados ainda.</p>';
    var tot = rotulos.map(function(_, i){ return camadas.reduce(function(a, c){ return a + c.valores[i]; }, 0); });
    var max = Math.max(1, Math.max.apply(null, tot));
    var x = function(i){ return P.l + (n === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (n - 1)); };
    var y = function(v){ return H - P.b - (v / max) * (H - P.t - P.b); };
    var g = eixos(rotulos, max, x, y), base = rotulos.map(function(){ return 0; });
    camadas.forEach(function(c){
      var topo = base.map(function(b, i){ return b + c.valores[i]; });
      var pts = topo.map(function(v, i){ return x(i) + ',' + y(v); }).concat(base.map(function(v, i){ return x(i) + ',' + y(v); }).reverse());
      g += '<polygon fill="' + c.cor + '" fill-opacity="0.85" points="' + pts.join(' ') + '"/>';
      base = topo;
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + '</svg>' + legenda(camadas.slice().reverse());
  }
  function grafBarras(valores, rotulos){
    var n = rotulos.length; if (!n) return '<p class="sub">Sem dados ainda.</p>';
    var max = Math.max(1, Math.max.apply(null, valores)), larg = (W - P.l - P.r) / n;
    var x = function(i){ return P.l + larg * i + larg / 2; };
    var y = function(v){ return H - P.b - (v / max) * (H - P.t - P.b); };
    var g = eixos(rotulos, max, x, y);
    valores.forEach(function(v, i){ g += '<rect x="' + (x(i) - larg * 0.35) + '" y="' + y(v) + '" width="' + (larg * 0.7) + '" height="' + (H - P.b - y(v)) + '" rx="2" fill="var(--c1)"/>' +
      '<text x="' + x(i) + '" y="' + (y(v) - 4) + '" text-anchor="middle" font-size="10" fill="var(--fg)">' + v + '</text>'; });

  }

  var fc = D.fluxo_cumulativo || [], vz = D.vazao_semanal || [];
  var h = '';

  h += '<header><h1>' + esc(P0.nome) + '</h1><p class="sub">' + esc(P0.repositorio) + ' · card-mãe ' + esc(P0.card_mae) +

  h += '<section class="cartao"><h2>Produto concluído: ' + num(R.percentual) + '%</h2>' + barra(R.percentual) +
       '<p class="sub">' + num(R.historias_concluidas, 0) + ' de ' + num(R.historias_total, 0) + ' histórias e bugs</p></section>';

  h += '<section class="kpis">' + [
      ['Tempo médio de ciclo', horas(R.ciclo_medio_horas)], ['Ciclo (últimas 4 semanas)', horas(R.ciclo_medio_4_semanas_horas)],
      ['Em andamento (WIP)', num(R.wip_atual, 0)], ['Aguardando o BD', num(R.aguardando_bd, 0)],
      ['Bloqueios', num(R.bloqueios, 0)], ['Reinícios de agentes', num(R.reinicios_total, 0)]
    ].map(function(k){ return '<div class="cartao kpi"><span>' + k[0] + '</span><b>' + k[1] + '</b></div>'; }).join('') + '</section>';

  h += '<section class="cartao"><h2>Épicos</h2>' + tabela(['Épico','Status','Progresso','Concluídas','Ciclo médio'],
       (D.epicos || []).map(function(e){ return [esc(e.identificador) + ' · ' + esc(e.titulo), esc(e.status), barra(e.percentual) + ' ' + num(e.percentual) + '%', num(e.concluidas,0) + '/' + num(e.total,0), horas(e.ciclo_medio_horas)]; })) + '</section>';

  h += '<section class="grade">' + (D.epicos || []).map(function(e){
      var b = e.burnup || [];
      return '<div class="cartao"><h2>Burnup · ' + esc(e.titulo) + '</h2>' + grafLinhas([
        {nome: 'Escopo', cor: 'var(--c7)', valores: b.map(function(p){ return p.escopo; })},
        {nome: 'Concluídas', cor: 'var(--c2)', valores: b.map(function(p){ return p.concluidas; })}
      ], b.map(function(p){ return dataBR(p.data); })) + '</div>';
    }).join('') + '</section>';

  h += '<section class="grade"><div class="cartao"><h2>Fluxo cumulativo</h2>' +
       grafAreas(COL.map(function(c){ return {nome: c[1], cor: c[2], valores: fc.map(function(d){ return d[c[0]] || 0; })}; }), fc.map(function(d){ return dataBR(d.data); })) +
       '<details><summary>Ver números</summary>' + tabela(['Dia'].concat(COL.map(function(c){ return c[1]; })), fc.map(function(d){ return [dataBR(d.data)].concat(COL.map(function(c){ return d[c[0]] || 0; })); })) + '</details></div>';
  h += '<div class="cartao"><h2>Vazão semanal (histórias concluídas)</h2>' +

  var comRet = (D.historias || []).filter(function(x){ return x.retornos > 0 || x.reinicios > 0; }).sort(function(a, b){ return (b.retornos - a.retornos) || (b.reinicios - a.reinicios); });

  h += '<section class="grade"><div class="cartao"><h2>Aguardando o BD</h2>' + tabela(['Card','Motivo','Há'],
       (D.aguardando_bd || []).map(function(x){ return [esc(x.identificador) + ' · ' + esc(x.titulo), esc(x.motivo), desde(x.desde)]; })) + '</div>';
  h += '<div class="cartao"><h2>Bloqueios</h2>' + tabela(['Card','Motivo','Há'],
       (D.bloqueios || []).map(function(x){ return [esc(x.identificador) + ' · ' + esc(x.titulo), esc(x.motivo), desde(x.desde)]; })) + '</div></section>';

  app.innerHTML = h;
})();
</script>
